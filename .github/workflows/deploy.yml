name: Deploy to AWS

on:
  push:
    branches: [main]

# Requires CI to pass first
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI check
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    name: Backend → ECR + EC2
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_URI: ${{ steps.ecr-login.outputs.registry }}/coffee-backend
        run: |
          docker build -t "$ECR_URI:latest" -t "$ECR_URI:${{ github.sha }}" ./backend
          docker push "$ECR_URI:latest"
          docker push "$ECR_URI:${{ github.sha }}"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ec2-user
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     AWS_REGION,MONGODB_URI,JWT_SECRET,CLIENT_ORIGIN,FRONTEND_URL,LINE_PAY_CHANNEL_ID,LINE_PAY_CHANNEL_SECRET,LINE_PAY_API_BASE_URL,LINE_PAY_CONFIRM_URL,LINE_PAY_CANCEL_URL
          script: /opt/coffee-app/run.sh
        env:
          AWS_REGION:              ${{ secrets.AWS_REGION }}
          MONGODB_URI:             ${{ secrets.MONGODB_URI }}
          JWT_SECRET:              ${{ secrets.JWT_SECRET }}
          CLIENT_ORIGIN:           ${{ secrets.CLIENT_ORIGIN }}
          FRONTEND_URL:            ${{ secrets.FRONTEND_URL }}
          LINE_PAY_CHANNEL_ID:     ${{ secrets.LINE_PAY_CHANNEL_ID }}
          LINE_PAY_CHANNEL_SECRET: ${{ secrets.LINE_PAY_CHANNEL_SECRET }}
          LINE_PAY_API_BASE_URL:   ${{ secrets.LINE_PAY_API_BASE_URL }}
          LINE_PAY_CONFIRM_URL:    ${{ secrets.LINE_PAY_CONFIRM_URL }}
          LINE_PAY_CANCEL_URL:     ${{ secrets.LINE_PAY_CANCEL_URL }}

  deploy-frontend:
    name: Frontend → S3 + CloudFront
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SOCKET_URL:   ${{ secrets.VITE_SOCKET_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
